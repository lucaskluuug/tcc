seed: 42

paths:
  raw_dir: data/raw/FlickrLogos-32/dataset_v2/FlickrLogos-v2
  processed_dir: data/processed
  cache_dir: data/cache
  outputs_dir: outputs

dataset:
  name: FlickrLogos-32
  num_classes: 32
  no_logo_label: no-logo
  images_per_class_train: 10
  images_per_class_val: 30
  images_per_class_test: 30
  no_logo_images_val: 3000
  no_logo_images_test: 3000

crop:
  strategy: tight_pad
  padding_ratio: 0.10
  output_size: 640

augmentation:
  enabled: true
  horizontal_flip_prob: 0.5
  scale_range: [0.8, 1.2]
  brightness_delta: 0.2
  contrast_delta: 0.2
  saturation_delta: 0.2
  hue_delta: 0.02
  copies_per_image: 3

metrics:
  iou_thresholds: [0.5, 0.75]
  primary_iou_threshold: 0.5
